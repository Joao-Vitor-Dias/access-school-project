<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>WhatsApp API</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/home.css}">

</head>

<body>

<div class="container py-4">

    <h2 class="mb-4">
        WhatsApp Selenium API
    </h2>

    <div class="row">

        <!-- STATUS -->

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-header">

                    Status

                </div>

                <div class="card-body">

                    <div class="mb-3">

                        <span id="driverStatus"
                              class="badge bg-danger">

                            Selenium OFF

                        </span>

                    </div>

                    <div class="mb-4">

                        <span id="whatsappStatus"
                              class="badge bg-danger">

                            WhatsApp OFF

                        </span>

                    </div>

                    <div class="d-grid gap-2">

                        <button
                                id="btnConnect"
                                class="btn btn-success">

                            Conectar

                        </button>

                        <button
                                id="btnDisconnect"
                                class="btn btn-danger">

                            Desconectar

                        </button>

                        <button
                                id="btnPopup"
                                class="btn btn-warning">

                            Fechar Popup

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- QR -->

        <div class="col-md-8">

            <div class="card shadow-sm">

                <div class="card-header">

                    QR Code

                </div>

                <div class="card-body text-center">

                    <img

                            id="qrImage"

                            class="img-fluid"

                            style="max-height:350px"

                            src="/v2/message/qr"

                            alt="QR Code"

                    >

                    <br><br>

                    <button

                            class="btn btn-outline-primary"

                            id="btnRefreshQr">

                        Atualizar QR

                    </button>

                </div>

            </div>

        </div>

    </div>

    <br>

    <!-- ENVIO -->

    <div class="card shadow-sm">

        <div class="card-header">

            Enviar Mensagem

        </div>

        <div class="card-body">

            <div class="mb-3">

                <label>

                    Telefone(s)

                </label>

                <input

                        id="phone"

                        class="form-control"

                        placeholder="5511999999999,5511888888888"

                >

            </div>

            <div class="mb-3">

                <label>

                    Mensagem

                </label>

                <textarea

                        id="message"

                        rows="5"

                        class="form-control">

                </textarea>

            </div>

            <button

                    id="btnSend"

                    class="btn btn-primary">

                Enviar

            </button>

        </div>

    </div>

    <br>

    <!-- LOG -->

    <div class="card shadow-sm">

        <div class="card-header">

            Eventos

        </div>

        <div class="card-body">

            <div

                    id="log"

                    class="log-box">

            </div>

        </div>

    </div>

</div>

<script th:src="@{/js/home.js}"></script>

</body>

</html>
